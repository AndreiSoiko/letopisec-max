server {
    server_name letopisecmax.ru www.letopisecmax.ru;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/letopisec/web/staticfiles/;
        expires 30d;
    }

    # T-Bank webhook бота (WEBHOOK_PORT в max-bot/.env)
    location /tinkoff/notify {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Страница оферты (отдаётся ботом на том же порту, что и T-Bank webhook)
    location /oferta {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django / Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API FastAPI (бот)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/letopisecmax.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/letopisecmax.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.letopisecmax.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = letopisecmax.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name letopisecmax.ru www.letopisecmax.ru;
    return 404; # managed by Certbot
}
