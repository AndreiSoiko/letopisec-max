server {
    listen 80;
    server_name letopisecmax.ru www.letopisecmax.ru;

    # Редирект на HTTPS (раскомментировать после настройки SSL)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/letopisec/web/staticfiles/;
        expires 30d;
    }

    # T-Bank webhook бота (WEBHOOK_PORT в max-bot/.env)
    location /tinkoff/notify {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django / Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API FastAPI (бот)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

