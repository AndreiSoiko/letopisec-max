<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Летописец{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1e2a3a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { width: 100%; max-width: 420px; }
    .logo { font-size: 2rem; font-weight: 700; color: #fff; text-align: center; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
<div class="auth-card px-3">
  <div class="logo">✍️ Летописец</div>
  <div class="card p-4 shadow">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} py-2">{{ message }}</div>
    {% endfor %}
    {% block auth_content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
