{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Летописец{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --violet: #6E1AFF; --grad: linear-gradient(135deg, #471AFF 0%, #9500FF 100%); --grad-hover: linear-gradient(135deg, #3813d1 0%, #7d00d6 100%); }
    body { background: var(--grad); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo img { height: 112px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    .btn-primary { background: var(--grad); border: none; }
    .btn-primary:hover, .btn-primary:focus { background: var(--grad-hover); }
    a { color: var(--violet); }
  </style>
</head>
<body>
<div class="auth-card px-3">
  <div class="logo"><a href="/"><img src="{% static 'dashboard/img/logo.png' %}" alt="Летописец"></a></div>
  <div class="card p-4 shadow">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} py-2">{{ message }}</div>
    {% endfor %}
    {% block auth_content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
