{% extends "base_auth.html" %}
{% block title %}Войти — Летописец{% endblock %}

{% block auth_content %}
<h4 class="mb-4 fw-bold">Вход в аккаунт</h4>

<form method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required autofocus
           value="{{ form.email.value|default:'' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Пароль</label>
    <input type="password" name="password" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
</form>

<div class="d-grid gap-2">
  <a href="/accounts/vk/" class="btn btn-outline-primary">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="me-2"><path d="M15.07 2H8.93C3.33 2 2 3.33 2 8.93v6.14C2 20.67 3.33 22 8.93 22h6.14C20.67 22 22 20.67 22 15.07V8.93C22 3.33 20.67 2 15.07 2zm2.78 13.75h-1.56c-.59 0-.77-.47-1.83-1.54-1.03-1.05-1.48-.7-1.79.03-.31.74-.31 1.51-.5 1.51h-.83c-2.58 0-4.43-1.63-4.43-4.57 0-2.65 1.45-4.55 3.62-4.55.97 0 1.36.73 1.36 1.68v1.91c0 .24.09.48.39.48.88 0 2.07-1.25 2.07-2.83 0-1.22-.66-2.36-2.27-2.36-2.18 0-3.83 1.83-3.83 4.31 0 2.87 1.82 4.63 4.41 4.63.63 0 1.04-.08 1.35-.13.27-.04.49.13.5.4.01.27-.23.53-.5.53h-.01c-3.23 0-6.04-2.59-6.04-5.57 0-3.11 2.09-5.36 4.83-5.36 2.46 0 3.44 1.78 3.44 3.3 0 2.04-1.46 3.68-2.92 3.68-.45 0-.79-.24-.84-.62l-.15-.94c-.34.84-.98 1.61-1.85 1.61-1 0-1.6-.83-1.6-2.01 0-1.65.94-3.25 2.25-3.25.74 0 1.16.43 1.34 1.04l.28-1.05h.94l-.63 2.99c-.04.16-.06.32-.06.47 0 .37.17.58.5.58.77 0 1.66-1.09 1.66-2.58 0-1.07-.62-2.13-2.26-2.13-1.93 0-3.37 1.52-3.37 3.83 0 1.91.97 3.07 2.47 3.07.62 0 1.24-.25 1.73-.77l.45.64c-.6.62-1.39.98-2.22.98z"/></svg>
    Войти через VK
  </a>
  <a href="/accounts/yandex/" class="btn btn-outline-danger">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="me-2"><path d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12zm11.206-5.499h-1.022c-1.633 0-2.494.878-2.494 2.32 0 1.24.535 1.942 1.633 2.722l.906.633-2.661 3.877H7.467l2.416-3.512c-1.391-.974-2.184-1.977-2.184-3.633 0-2.112 1.464-3.476 4.03-3.476h2.623v10.621h-1.146V6.501z"/></svg>
    Войти через Яндекс
  </a>
</div>

<hr>
<p class="text-center mb-0">Нет аккаунта? <a href="/accounts/register/">Зарегистрироваться</a></p>
{% endblock %}
